conky.config = {
    out_to_x = true,
    out_to_wayland = false,
    
    own_window = true,
    own_window_type = 'override',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    
    double_buffer = true,
    
    alignment = 'top_middle',
    gap_x = 0,
    gap_y = 13,
    
    minimum_width = 900,
    
    use_xft = true,
    font = 'Anurati:size=10',
    xftalpha = 1.0,
    
    update_interval = 1,
    
    draw_shades = true,
    default_shade_color = '#0a1a2e',
    
    draw_outline = false,
    draw_borders = false,
    
    default_color = '#FFE135',
}

conky.text = [[
${voffset 0}${font Poppins:bold:size=72}${alignc}${time %^A}${font}
${voffset 45}${font Anurati:size=22}${alignc}${time %d %b %Y}${font}
${voffset 30}${font Anurati:size=16}${alignc}- ${time %I:%M %p} -${font}
]]
